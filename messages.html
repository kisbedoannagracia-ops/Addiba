<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101f3c">
<title>Messages reçus | ADDIBA</title>

<style>
:root{
  --navy:#101f3c;
  --green:#20bd83;
  --bg:#f3f6fa;
  --text:#24334b;
  --muted:#718096;
  --border:#e5eaf1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:var(--navy);
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}
.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:1px;
  text-decoration:none;
  color:white;
}
.logo span{color:var(--green)}
header a:not(.logo){
  color:white;
  text-decoration:none;
}
main{
  max-width:1100px;
  margin:35px auto;
  padding:0 18px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:22px;
}
h1{
  font-size:27px;
  color:var(--navy);
  margin-bottom:5px;
}
.subtitle{
  color:var(--muted);
  font-size:14px;
}
.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}
button,.linkbtn{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  font-size:13px;
}
.primary{background:var(--green);color:var(--navy)}
.secondary{background:#e5ebf3;color:var(--navy)}
.info{
  padding:13px 15px;
  border-radius:8px;
  margin:15px 0;
  display:none;
  font-size:14px;
}
.info.error{
  display:block;
  background:#fff0f0;
  color:#a52a35;
}
.stats{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
  margin:20px 0;
}
.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
}
.stat span{
  color:var(--muted);
  font-size:13px;
}
.stat strong{
  display:block;
  color:var(--navy);
  font-size:26px;
  margin-top:6px;
}
.list{display:grid;gap:14px}
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:11px;
  padding:20px;
}
.cardhead{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:12px;
}
.card h2{
  font-size:17px;
  color:var(--navy);
  margin-bottom:5px;
  overflow-wrap:anywhere;
}
.meta{
  font-size:12px;
  color:var(--muted);
}
.subject{
  display:inline-block;
  background:#e7f7f0;
  color:#13784e;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}
.message{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.65;
  font-size:14px;
  margin:14px 0;
  color:#35445b;
}
.email{
  color:#1769aa;
  font-size:13px;
  overflow-wrap:anywhere;
}
.reply{
  display:inline-block;
  margin-top:10px;
  background:var(--navy);
  color:white;
  padding:9px 13px;
  border-radius:7px;
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
}
.empty{
  background:white;
  border:1px dashed #cbd5e1;
  border-radius:10px;
  padding:35px;
  text-align:center;
  color:var(--muted);
}
footer{
  text-align:center;
  padding:25px;
  color:var(--muted);
  font-size:12px;
}
@media(max-width:500px){
  .stats{grid-template-columns:1fr}
  h1{font-size:23px}
  .card{padding:16px}
}
</style>
</head>

<body>

<header>
  <a href="dashboard.html" class="logo">ADDI<span>BA</span></a>
  <a href="dashboard.html">← Retour à l'administration</a>
</header>

<main>

  <div class="top">
    <div>
      <h1>Messages reçus</h1>
      <p class="subtitle">
        Boîte de réception privée du groupe ADDIBA.
      </p>
    </div>

    <div class="actions">
      <button class="secondary" id="refresh" type="button">
        Actualiser
      </button>

      <a class="linkbtn primary" href="contact.html">
        Voir la page Contact
      </a>
    </div>
  </div>

  <div id="info" class="info" role="alert"></div>

  <div class="stats">
    <div class="stat">
      <span>Total des messages</span>
      <strong id="total">—</strong>
    </div>

    <div class="stat">
      <span>Messages nouveaux</span>
      <strong id="newCount">—</strong>
    </div>
  </div>

  <div id="list" class="list">
    <div class="empty">
      Vérification de votre accès...
    </div>
  </div>

</main>

<footer>
  © 2026 ADDIBA — Messagerie privée du fondateur
</footer>

<script type="module">

import { supabase } from "./supabase.js";

const list = document.getElementById("list");
const info = document.getElementById("info");
const refresh = document.getElementById("refresh");

function showError(text){
  info.textContent = text;
  info.className = "info error";
}

function dateFr(value){
  if(!value) return "Date inconnue";

  return new Date(value).toLocaleString("fr-FR",{
    dateStyle:"long",
    timeStyle:"short"
  });
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c];
  });
}

async function loadMessages(){

  refresh.disabled = true;
  refresh.textContent = "Chargement...";
  info.className = "info";

  list.innerHTML =
    '<div class="empty">Chargement des messages...</div>';

  try{

    const {
      data:{session},
      error:sessionError
    } = await supabase.auth.getSession();

    if(sessionError) throw sessionError;

    if(!session){
      window.location.href = "connexion.html";
      return;
    }

    const {
      data:profile,
      error:profileError
    } = await supabase
      .from("profils")
      .select("role")
      .eq("id",session.user.id)
      .maybeSingle();

    if(profileError) throw profileError;

    if(!profile || profile.role !== "fondateur"){
      await supabase.auth.signOut();
      window.location.href = "connexion.html";
      return;
    }

    const {
      data:messages,
      error
    } = await supabase
      .from("contact_messages")
      .select("id, nom, email, sujet, message, statut, created_at")
      .order("created_at",{ascending:false});

    if(error) throw error;

    const rows = messages || [];

    document.getElementById("total").textContent =
      rows.length;

    document.getElementById("newCount").textContent =
      rows.filter(function(item){
        return item.statut === "nouveau";
      }).length;

    if(rows.length === 0){
      list.innerHTML =
        '<div class="empty">Aucun message reçu pour le moment.</div>';
      return;
    }

    list.innerHTML = rows.map(function(item){

      const email = String(item.email || "");

      const mailto =
        "mailto:" + encodeURIComponent(email) +
        "?subject=" +
        encodeURIComponent("Réponse à votre message - ADDIBA");

      return `
        <article class="card">

          <div class="cardhead">
            <div>
              <h2>${escapeHtml(item.nom)}</h2>

              <div class="meta">
                Reçu le ${escapeHtml(dateFr(item.created_at))}
              </div>

              <div class="email">
                ${escapeHtml(email)}
              </div>
            </div>

            <span class="subject">
              ${escapeHtml(item.sujet)}
            </span>
          </div>

          <div class="message">
            ${escapeHtml(item.message)}
          </div>

          <a class="reply" href="${mailto}">
            Répondre par e-mail
          </a>

        </article>
      `;

    }).join("");

  }catch(error){

    console.error(error);

    showError(
      "Impossible de charger les messages. Vérifie ta connexion et les autorisations Supabase. Détail : " +
      (error.message || "Erreur inconnue")
    );

    list.innerHTML = "";

  }finally{

    refresh.disabled = false;
    refresh.textContent = "Actualiser";

  }
}

refresh.addEventListener("click",loadMessages);

loadMessages();

</script>

</body>
</html>
