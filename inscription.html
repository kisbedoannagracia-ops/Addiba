<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription entreprise | ADDIBA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #20242c;
    }
    header {
      background: #151923;
      color: #101f3c;
      padding: 22px;
      text-align: center;
    }
    header h1 { margin: 0; letter-spacing: 2px; }
    main {
      max-width: 560px;
      margin: 35px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px #00000012;
    }
    h2 { margin-top: 0; }
    p { color: #626875; line-height: 1.5; }
    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd1d9;
      border-radius: 7px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #e58b27;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      line-height: 1.5;
    }
    .success { display: block !important; background: #e7f7ed; color: #176b35; }
    .error { display: block !important; background: #fdeaea; color: #a32121; }
    .login { text-align: center; margin-top: 20px; }
    a { color: #bd6b12; }
  </style>
</head>
<body>
  <header><h1>ADDIBA</h1></header>

  <main>
    <h2>Inscrire mon entreprise</h2>
    <p>Créez votre compte entreprise. Votre demande sera examinée par l'équipe ADDIBA avant l'ouverture de votre espace.</p>

    <form id="inscriptionForm">
      <label for="nom">Nom de l'entreprise *</label>
      <input id="nom" required maxlength="150" placeholder="Ex. : Mon entreprise">

      <label for="pays">Pays *</label>
      <input id="pays" required maxlength="100" value="Burkina Faso">

      <label for="secteur">Secteur d'activité</label>
      <input id="secteur" maxlength="150" placeholder="Ex. : Commerce, technologie...">

      <label for="emailEntreprise">Adresse e-mail de l'entreprise *</label>
      <input id="emailEntreprise" type="email" required maxlength="254" placeholder="contact@entreprise.com">

      <label for="telephone">Téléphone</label>
      <input id="telephone" type="tel" maxlength="30" placeholder="+226 ...">

      <hr style="margin:25px 0;border:0;border-top:1px solid #eee">

      <h3>Compte du responsable</h3>

      <label for="emailCompte">Votre adresse e-mail *</label>
      <input id="emailCompte" type="email" required maxlength="254" placeholder="vous@exemple.com">

      <label for="motDePasse">Mot de passe *</label>
      <input id="motDePasse" type="password" required minlength="8" autocomplete="new-password" placeholder="8 caractères minimum">

      <button id="submitBtn" type="submit">Créer mon compte et envoyer la demande</button>
    </form>

    <div id="message" role="status"></div>

    <div class="login">
      Vous avez déjà un compte ?
      <a href="connexion.html">Se connecter</a>
    </div>
  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.getElementById("inscriptionForm");
    const bouton = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    function afficherMessage(texte, erreur = false) {
      message.textContent = texte;
      message.className = erreur ? "error" : "success";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      bouton.disabled = true;
      bouton.textContent = "Envoi en cours...";
      message.className = "";

      let compteCree = false;

      try {
        const nom = document.getElementById("nom").value.trim();
        const pays = document.getElementById("pays").value.trim();
        const secteur = document.getElementById("secteur").value.trim();
        const emailEntreprise = document.getElementById("emailEntreprise").value.trim();
        const telephone = document.getElementById("telephone").value.trim();
        const emailCompte = document.getElementById("emailCompte").value.trim();
        const motDePasse = document.getElementById("motDePasse").value;

        if (!nom || !pays || !emailEntreprise || !emailCompte || motDePasse.length < 8) {
          throw new Error("Veuillez remplir correctement tous les champs obligatoires.");
        }

        const { data, error } = await supabase.auth.signUp({
          email: emailCompte,
          password: motDePasse
        });

        if (error) throw error;
        if (!data.user) {
          throw new Error("Le compte n'a pas pu être créé. Réessayez.");
        }

        compteCree = true;

        const { error: profilError } = await supabase
          .from("profils")
          .upsert({
            id: data.user.id,
            nom_complet: nom,
            role: "entreprise"
          });

        if (profilError) throw profilError;

        const { error: entrepriseError } = await supabase
          .from("entreprises")
          .insert({
            nom,
            pays,
            secteur: secteur || null,
            email: emailEntreprise,
            telephone: telephone || null,
            statut: "en_attente",
            created_by: data.user.id
          });

        if (entrepriseError) throw entrepriseError;

        form.reset();
        afficherMessage(
          "Votre compte a été créé et votre demande a été envoyée à ADDIBA. Votre entreprise doit être approuvée avant d'accéder à son espace."
        );

      } catch (error) {
        afficherMessage(
          (compteCree
            ? "Le compte a été créé, mais l'enregistrement de la demande a échoué. Contactez ADDIBA avant de recommencer. "
            : "Erreur : ") + error.message,
          true
        );
      } finally {
        bouton.disabled = false;
        bouton.textContent = "Créer mon compte et envoyer la demande";
      }
    });
  </script>
</body>
</html>
