<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des marques | ADDIBA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      color: #17243b;
    }

    header {
      background: #101f3c;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      color: #36c98a;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      color: #101f3c;
      margin-bottom: 10px;
    }

    .intro {
      color: #68758a;
      margin-bottom: 25px;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px #0000000b;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dce5;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 12px 17px;
      background: #20a875;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .cancel {
      background: #68758a;
      margin-left: 8px;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }

    .brand {
      border: 1px solid #e0e5ec;
      border-radius: 9px;
      padding: 18px;
      margin-top: 15px;
    }

    .brand h3 {
      color: #101f3c;
      margin-bottom: 8px;
    }

    .brand p {
      color: #68758a;
      margin: 7px 0;
    }

    .status {
      display: inline-block;
      background: #e7f8f0;
      color: #147a54;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    .actions button {
      margin-right: 8px;
    }

    .delete {
      background: #c0392b;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #68758a;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">ADDIBA</div>
  <a href="dashboard.html">← Retour au tableau de bord</a>
</header>

<main>

  <h1>Gestion des marques</h1>
  <p class="intro">
    Ajouter, consulter et organiser les marques de ADDIBA.
  </p>

  <section class="panel">

    <h2 id="form-title">Ajouter une marque</h2>

    <form id="brand-form">

      <label for="name">Nom de la marque</label>
      <input id="name" type="text" required placeholder="Ex : ALTEVA">

      <label for="description">Description</label>
      <textarea id="description" placeholder="Description de la marque"></textarea>

      <label for="status">Statut</label>
      <select id="status">
        <option value="en_preparation">En préparation</option>
        <option value="active">Active</option>
        <option value="suspendue">Suspendue</option>
      </select>

      <button type="submit" id="save-button">Enregistrer la marque</button>
      <button type="button" id="cancel-button" class="cancel" hidden>
        Annuler
      </button>

    </form>

    <p id="message" role="status"></p>

  </section>

  <section class="panel">

    <h2>Marques enregistrées</h2>

    <div id="brand-list">
      Chargement des marques...
    </div>

  </section>

</main>

<footer>© 2026 ADDIBA — Gestion des marques</footer>

<script type="module">

  import { supabase } from "./supabase.js";

  const form = document.getElementById("brand-form");
  const message = document.getElementById("message");
  const list = document.getElementById("brand-list");
  const saveButton = document.getElementById("save-button");
  const cancelButton = document.getElementById("cancel-button");

  let editingId = null;

  function showMessage(text, success = false) {
    message.textContent = text;
    message.style.color = success ? "#16875d" : "#c0392b";
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  async function checkFounder() {
    const { data, error } = await supabase.auth.getUser();

    if (error || !data.user) {
      window.location.href = "connexion.html";
      return false;
    }

    const { data: profile, error: profileError } = await supabase
      .from("profils")
      .select("role")
      .eq("id", data.user.id)
      .single();

    if (profileError || profile?.role !== "fondateur") {
      await supabase.auth.signOut();
      window.location.href = "connexion.html";
      return false;
    }

    return true;
  }

  async function loadBrands() {
    list.textContent = "Chargement...";

    const { data, error } = await supabase
      .from("marques")
      .select("*")
      .order("id");

    if (error) {
      list.textContent = "Erreur : impossible de charger les marques.";
      return;
    }

    if (!data || data.length === 0) {
      list.textContent = "Aucune marque enregistrée.";
      return;
    }

    list.innerHTML = data.map(brand => `
      <article class="brand">
        <h3>${escapeHTML(brand.nom)}</h3>
        <p>${escapeHTML(brand.description || "Aucune description")}</p>
        <p>
          Statut :
          <span class="status">${escapeHTML(brand.statut)}</span>
        </p>
        <div class="actions">
          <button type="button" data-edit="${brand.id}">Modifier</button>
          <button type="button" class="delete" data-delete="${brand.id}">
            Supprimer
          </button>
        </div>
      </article>
    `).join("");
  }

  function resetForm() {
    form.reset();
    editingId = null;
    document.getElementById("form-title").textContent = "Ajouter une marque";
    saveButton.textContent = "Enregistrer la marque";
    cancelButton.hidden = true;
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();

    saveButton.disabled = true;

    const brand = {
      nom: document.getElementById("name").value.trim().toUpperCase(),
      description: document.getElementById("description").value.trim(),
      statut: document.getElementById("status").value
    };

    try {
      let result;

      if (editingId !== null) {
        result = await supabase
          .from("marques")
          .update(brand)
          .eq("id", editingId);
      } else {
        result = await supabase
          .from("marques")
          .insert(brand);
      }

      if (result.error) throw result.error;

      showMessage("Marque enregistrée avec succès.", true);
      resetForm();
      await loadBrands();

    } catch (error) {
      showMessage("Erreur : " + error.message);
    } finally {
      saveButton.disabled = false;
    }
  });

  list.addEventListener("click", async event => {

    const editId = event.target.dataset.edit;
    const deleteId = event.target.dataset.delete;

    if (editId) {
      const { data, error } = await supabase
        .from("marques")
        .select("*")
        .eq("id", editId)
        .single();

      if (error || !data) {
        showMessage("Impossible de récupérer cette marque.");
        return;
      }

      editingId = data.id;
      document.getElementById("name").value = data.nom;
      document.getElementById("description").value = data.description || "";
      document.getElementById("status").value = data.statut;

      document.getElementById("form-title").textContent = "Modifier une marque";
      saveButton.textContent = "Enregistrer les modifications";
      cancelButton.hidden = false;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    if (deleteId) {
      const confirmed = confirm(
        "Attention : veux-tu vraiment supprimer cette marque ?"
      );

      if (!confirmed) return;

      const { error } = await supabase
        .from("marques")
        .delete()
        .eq("id", deleteId);

      if (error) {
        showMessage("Suppression impossible : " + error.message);
        return;
      }

      showMessage("Marque supprimée.", true);
      await loadBrands();
    }

  });

  cancelButton.addEventListener("click", resetForm);

  if (await checkFounder()) {
    await loadBrands();
  }

</script>

</body>
</html>
